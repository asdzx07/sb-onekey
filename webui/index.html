<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优选 IP 订阅生成器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #333; padding: 20px; }
  .container { max-width: 960px; margin: 0 auto; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .header h1 { color: #e8912d; font-size: 26px; }
  .header p { color: #888; font-size: 13px; margin-top: 4px; }
  .card { background: #fff; border-radius: 14px; padding: 22px; margin-bottom: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .card h2 { font-size: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .card h2 .spacer { flex: 1; }
  .row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .field { flex: 1; min-width: 180px; }
  .field label { display: block; font-size: 13px; color: #666; margin-bottom: 5px; }
  .field input, .field textarea { width: 100%; padding: 10px 13px; border: 1px solid #e0e0e0; border-radius: 9px; font-size: 14px; background: #fafbfc; }
  .field input:focus, .field textarea:focus { outline: none; border-color: #e8912d; background: #fff; }
  .field textarea { min-height: 130px; font-family: Consolas, monospace; font-size: 13px; resize: vertical; }
  .btn { padding: 10px 22px; border: none; border-radius: 9px; font-size: 14px; cursor: pointer; font-weight: 500; }
  .btn-orange { background: #e8912d; color: #fff; }
  .btn-orange:hover { background: #d1801f; }
  .btn-blue { background: #1a9bf0; color: #fff; }
  .btn-blue:hover { background: #0d8ae0; }
  .btn-green { background: #22b573; color: #fff; }
  .btn-green:hover { background: #1a9e63; }
  .btn-gray { background: #f0f1f4; color: #666; }
  .btn-gray:hover { background: #e2e4e8; }
  .btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 7px; }
  .hint { font-size: 12px; color: #999; margin-top: 6px; }
  .sub-row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .sub-row .name { width: 110px; font-size: 14px; font-weight: 500; flex-shrink: 0; }
  .sub-row input { flex: 1; padding: 9px 13px; border: 1px solid #e0e0e0; border-radius: 9px; font-size: 13px; background: #fafbfc; font-family: Consolas, monospace; }
  .sub-row .actions { display: flex; gap: 6px; flex-shrink: 0; }
  .node-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .hidden { display: none; }
  .ok-msg { background: #e8f8f0; color: #1a9e63; padding: 8px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .warn-msg { background: #fff7e8; color: #b7791f; padding: 8px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  #qrcodeBox { text-align: center; padding: 12px; }
  .divider { border: none; border-top: 1px solid #f0f0f0; margin: 16px 0; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>🚀 优选 IP 订阅生成器</h1>
      <p>为 VLESS+WS+TLS 节点批量生成优选 IP 订阅 · v1.1</p>
    </div>
  </div>

  <!-- 本机节点 -->
  <div class="card">
    <h2>🖥️ 本机 sb-onekey 节点 <span class="spacer"></span><button class="btn btn-gray btn-sm" onclick="loadLocalNodes()">🔄 刷新</button></h2>
    <div id="localNodes"><p class="hint">正在加载…</p></div>
  </div>

  <!-- 节点配置 -->
  <div class="card">
    <h2>📝 节点配置</h2>
    <div id="saveMsg"></div>
    <div class="row">
      <div class="field"><label>UUID</label><input id="uuid" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div>
      <div class="field"><label>域名 (HOST / SNI)</label><input id="host" placeholder="example.com"></div>
    </div>
    <div class="row">
      <div class="field"><label>端口</label><input id="port" value="443"></div>
      <div class="field"><label>WS 路径</label><input id="path" placeholder="/xxx"></div>
      <div class="field"><label>订阅名称</label><input id="subName" value="优选"></div>
    </div>
    <div class="row">
      <div class="field">
        <label>优选 IP 列表（一行一个，格式：<code>IP:端口#备注</code>）</label>
        <textarea id="ipList" placeholder="104.16.0.1:443#电信优选&#10;172.67.0.1:8443#联通优选&#10;162.159.0.1"></textarea>
      </div>
    </div>
    <div class="row">
      <button class="btn btn-orange" onclick="saveAll()">💾 保存配置</button>
      <span class="hint">保存到服务器，订阅链接实时生效</span>
    </div>
  </div>

  <!-- 订阅链接 -->
  <div class="card">
    <h2>📋 订阅链接 <span class="spacer"></span><button class="btn btn-gray btn-sm" onclick="refreshSubUrls()">🔄 刷新</button></h2>
    <p class="hint" style="margin-bottom:12px;">把下面的链接填到 Clash Verge Rev / v2rayN / SFA 里当订阅用，改了优选 IP 后点保存即生效，不用重新复制</p>
    <div class="sub-row">
      <span class="name">VLESS 明文</span>
      <input id="url-vless" readonly onclick="this.select()">
      <div class="actions"><button class="btn btn-blue btn-sm" onclick="copyUrl('url-vless')">复制</button><button class="btn btn-gray btn-sm" onclick="showQR('url-vless')">二维码</button></div>
    </div>
    <div class="sub-row">
      <span class="name">Base64 订阅</span>
      <input id="url-base64" readonly onclick="this.select()">
      <div class="actions"><button class="btn btn-blue btn-sm" onclick="copyUrl('url-base64')">复制</button><button class="btn btn-gray btn-sm" onclick="showQR('url-base64')">二维码</button></div>
    </div>
    <div class="sub-row">
      <span class="name">Clash 订阅</span>
      <input id="url-clash" readonly onclick="this.select()">
      <div class="actions"><button class="btn btn-blue btn-sm" onclick="copyUrl('url-clash')">复制</button><button class="btn btn-gray btn-sm" onclick="showQR('url-clash')">二维码</button></div>
    </div>
    <div class="sub-row">
      <span class="name">sing-box 订阅</span>
      <input id="url-singbox" readonly onclick="this.select()">
      <div class="actions"><button class="btn btn-blue btn-sm" onclick="copyUrl('url-singbox')">复制</button><button class="btn btn-gray btn-sm" onclick="showQR('url-singbox')">二维码</button></div>
    </div>
    <div id="qrcodeBox" class="hidden"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const base = location.origin;

// ---------- 本机节点 ----------
async function loadLocalNodes() {
  const box = document.getElementById('localNodes');
  try {
    const r = await fetch('/api/nodes');
    const d = await r.json();
    if (!d.sb_installed) { box.innerHTML = '<p class="hint">本机未安装 sb-onekey，请手动填写下方配置。</p>'; return; }
    if (!d.nodes.length) { box.innerHTML = '<p class="hint">本机还没有 VLESS+WS(+TLS) 节点。</p>'; return; }
    box.innerHTML = '<div class="node-chips">' + d.nodes.map(n =>
      `<button class="btn btn-gray btn-sm" onclick='pickNode(${JSON.stringify(n).replace(/'/g, "&#39;")})'>${n.name}</button>`
    ).join('') + '</div>';
  } catch(e) {
    box.innerHTML = '<p class="hint">读取失败：' + e.message + '</p>';
  }
}
function pickNode(n) {
  document.getElementById('uuid').value = n.uuid || '';
  document.getElementById('host').value = n.host || '';
  document.getElementById('port').value = n.port || '443';
  document.getElementById('path').value = n.path || '/';
  msg('已填入节点 <b>' + n.name + '</b>，记得点保存', 'ok');
}

// ---------- 配置存取 ----------
async function loadSaved() {
  try {
    const r = await fetch('/api/config');
    const c = await r.json();
    if (c.uuid) document.getElementById('uuid').value = c.uuid;
    if (c.host) document.getElementById('host').value = c.host;
    if (c.port) document.getElementById('port').value = c.port;
    if (c.path) document.getElementById('path').value = c.path;
    if (c.subName) document.getElementById('subName').value = c.subName;
    if (c.ipList) document.getElementById('ipList').value = c.ipList;
  } catch(e) {}
}
function collect() {
  return {
    uuid: document.getElementById('uuid').value.trim(),
    host: document.getElementById('host').value.trim(),
    port: document.getElementById('port').value.trim() || '443',
    path: document.getElementById('path').value.trim() || '/',
    subName: document.getElementById('subName').value.trim() || '优选',
    ipList: document.getElementById('ipList').value,
  };
}
async function saveAll() {
  const c = collect();
  if (!c.uuid || !c.host) { msg('请先填写 UUID 和域名', 'warn'); return; }
  if (!c.ipList.trim()) { msg('请填写优选 IP 列表', 'warn'); return; }
  const r = await fetch('/api/save', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(c) });
  const d = await r.json();
  if (d.ok) { msg('✅ 已保存，订阅链接已生效', 'ok'); refreshSubUrls(); }
  else msg('保存失败', 'warn');
}
function msg(t, cls) {
  document.getElementById('saveMsg').innerHTML = `<div class="${cls === 'ok' ? 'ok-msg' : 'warn-msg'}">${t}</div>`;
  setTimeout(() => document.getElementById('saveMsg').innerHTML = '', 4000);
}

// ---------- 订阅链接 ----------
function refreshSubUrls() {
  ['vless','base64','clash','singbox'].forEach(k => {
    document.getElementById('url-' + k).value = base + '/sub/' + k;
  });
}
function copyUrl(id) {
  const el = document.getElementById(id);
  el.select();
  document.execCommand('copy');
  msg('已复制', 'ok');
}
function showQR(id) {
  const box = document.getElementById('qrcodeBox');
  box.classList.remove('hidden');
  box.innerHTML = '';
  new QRCode(box, { text: document.getElementById(id).value, width: 160, height: 160 });
  box.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

loadLocalNodes();
loadSaved();
refreshSubUrls();
</script>
</body>
</html>
